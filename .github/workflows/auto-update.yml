name: Auto Jafria Update
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update Date
        run: |
          pip install hijri-converter
          cat > update.py << 'PY'
          from hijri_converter import Gregorian
          from datetime import datetime, timedelta
          import json, os
          today = datetime.utcnow() + timedelta(hours=5)
          h = Gregorian(today.year, today.month, today.day).to_hijri()
          path = "hijri/calendar/jafria/1448.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          date_str = today.strftime("%Y-%m-%d")
          data["last_updated"] = today.isoformat()
          data["today"] = {"gregorian": date_str, "hijri_day": h.day, "hijri_month": h.month, "hijri_year": h.year}
          data["days"][date_str] = {"d": h.day, "m": h.month, "y": h.year}
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          PY
          python update.py
      - name: Save
        run: |
          git config user.name "Jafria-Bot"
          git config user.email "bot@hijri.local"
          git add -A
          git commit -m "Auto: $(date +%Y-%m-%d)" || echo "No changes"
          git push
